active_distro = "nixos"

# System Packages (nixpkgs IMPERATIVE)
# -----------------------------------------------------------------------------
[app] # JUST IMPERATIVE FOR NOW, STILL FIGURING OUT CONFIGURATION.NIX WITHOUT BREAKING COMPUTERS, u can use "config edit" tho
update = "sudo nixos-rebuild switch --upgrade"
install = "nix-env -iA nixos.{1}"
remove = "nix-env -e {1}"
search = "nix-env -qaP {1}"

# System Utilities
# -----------------------------------------------------------------------------
[sys]
list_usb = "lsusb"
list_partitions = "lsblk -f"
disk_space = "df -h"
processes = "btop"
make_executable = "chmod +x {1}"
create_folder = "mkdir -p {1}"

# Boot Utilities
# -----------------------------------------------------------------------------
[boot]
flash_iso = "sudo dd if={1} of={2} bs=4M status=progress oflag=sync"
format_fat32 = "sudo mkfs.vfat -F 32 {1}"
format_ext4 = "sudo mkfs.ext4 {1}"
unmount = "sudo umount {1}"

# File Editing
# -----------------------------------------------------------------------------
[edit]
read = "cat {1}"
write = "micro {1}"

# Rice (to be added)
# -----------------------------------------------------------------------------
[rice]
# Soon

# Dotfiles (to be added)
# -----------------------------------------------------------------------------
[dots]
# Soon

# Services and Daemons
# -----------------------------------------------------------------------------
[service]
start = "sudo systemctl start {1}"
stop = "sudo systemctl stop {1}"
restart = "sudo systemctl restart {1}"
status = "systemctl status {1}"
enable = "sudo systemctl enable {1}"
disable = "sudo systemctl disable {1}"
list_all = "systemctl list-units --type=service"

# Generations
# -----------------------------------------------------------------------------
[gen]
list = "sudo nix-env --list-generations -p /nix/var/nix/profiles/system"
rollback = "sudo nixos-rebuild switch --rollback"
switch_to = "sudo nix-env --switch-generation {1} -p /nix/var/nix/profiles/system"
delete_old = "sudo nix-collect-garbage -d"
current = "readlink /run/current-system"

# Cleanup / Garbage Collection
# -----------------------------------------------------------------------------
[clean]
collect_garbage = "sudo nix-collect-garbage"
collect_garbage_older_than = "sudo nix-collect-garbage --delete-older-than {1}"
optimize_store = "nix-store --optimise"
store_size = "du -sh /nix/store"

# Flakes (for flakes model)
# -----------------------------------------------------------------------------
[flake]
switch = "sudo nixos-rebuild switch --flake {1}"
update_inputs = "nix flake update"
check = "nix flake check"
show = "nix flake show"

# Channels (for channels model)
# -----------------------------------------------------------------------------
[channel]
list = "nix-channel --list"
update = "sudo nix-channel --update"
add = "sudo nix-channel --add {1} {2}"
remove = "sudo nix-channel --remove {1}"

# Quick access to configuration.nix
# -----------------------------------------------------------------------------
[config]
edit = "sudo micro /etc/nixos/configuration.nix"
test = "sudo nixos-rebuild test"
build = "sudo nixos-rebuild build"

# Networking
# -----------------------------------------------------------------------------
[net]
show_ip = "ip a"
ping = "ping -c 4 {1}"
list_wifi = "nmcli device wifi list"
connect_wifi = "nmcli device wifi connect {1} password {2}"
status = "nmcli general status"
restart = "sudo systemctl restart NetworkManager"

# User Management
# -----------------------------------------------------------------------------
[user]
add = "sudo useradd -m {1}"
set_password = "sudo passwd {1}"
list_all = "cut -d: -f1 /etc/passwd"
list_groups = "groups {1}"

# Logs and diagnostics
# -----------------------------------------------------------------------------
[log]
boot = "journalctl -b"
service = "journalctl -u {1}"
follow = "journalctl -f"
errors = "journalctl -p err -b"
kernel = "dmesg"

# Hardware info
# -----------------------------------------------------------------------------
[hardware]
cpu_info = "lscpu"
memory_info = "free -h"
temperatures = "sensors"
gpu_info = "lspci -k | grep -A 3 -i vga"
devices = "lspci"