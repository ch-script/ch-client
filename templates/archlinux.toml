active_distro = "archlinux"

# System Packages (glorious pacman)
# -----------------------------------------------------------------------------
[app]
update = "sudo pacman -Syu"
install = "sudo pacman -S {1}"
remove = "sudo pacman -Rns {1}"
search = "pacman -Ss {1}"
info = "pacman -Si {1}"
list_installed = "pacman -Qe"

# Arch-specific Bootstrap (tools not available via pacman)
# -----------------------------------------------------------------------------
[arch-install]
yay = "sudo pacman -S --needed git base-devel && git clone https://aur.archlinux.org/yay.git /tmp/yay && cd /tmp/yay && makepkg -si"
paru = "sudo pacman -S --needed git base-devel && git clone https://aur.archlinux.org/paru.git /tmp/paru && cd /tmp/paru && makepkg -si"
base_devel = "sudo pacman -S --needed base-devel"

# AUR (yay helper)
# -----------------------------------------------------------------------------
[aur]
install = "yay -S {1}"
remove = "yay -Rns {1}"
search = "yay -Ss {1}"
update = "yay -Syu"

# System Utilities
# -----------------------------------------------------------------------------
[sys]
list_usb = "lsusb"
list_partitions = "lsblk -f"
disk_space = "df -h"
processes = "btop"
make_executable = "chmod +x {1}"
create_folder = "mkdir -p {1}"

# Boot Utilities
# -----------------------------------------------------------------------------
[boot]
flash_iso = "sudo dd if={1} of={2} bs=4M status=progress oflag=sync"
format_fat32 = "sudo mkfs.vfat -F 32 {1}"
format_ext4 = "sudo mkfs.ext4 {1}"
unmount = "sudo umount {1}"
update_grub = "sudo grub-mkconfig -o /boot/grub/grub.cfg"

# File Editing
# -----------------------------------------------------------------------------
[edit]
read = "cat {1}"
write = "micro {1}"

# Rice (to be added)
# -----------------------------------------------------------------------------
[rice]
# Soon

# Dotfiles (to be added)
# -----------------------------------------------------------------------------
[dots]
# Soon

# Services and Daemons
# -----------------------------------------------------------------------------
[service]
start = "sudo systemctl start {1}"
stop = "sudo systemctl stop {1}"
restart = "sudo systemctl restart {1}"
status = "systemctl status {1}"
enable = "sudo systemctl enable {1}"
disable = "sudo systemctl disable {1}"
list_all = "systemctl list-units --type=service"

# Cleanup / Cache Management
# -----------------------------------------------------------------------------
[clean]
clear_cache = "sudo pacman -Sc"
clear_cache_all = "sudo pacman -Scc"
remove_orphans = "sudo pacman -Rns $(pacman -Qtdq)"
cache_size = "du -sh /var/cache/pacman/pkg"

# Networking
# -----------------------------------------------------------------------------
[net]
show_ip = "ip a"
ping = "ping -c 4 {1}"
list_wifi = "nmcli device wifi list"
connect_wifi = "nmcli device wifi connect {1} password {2}"
status = "nmcli general status"
restart = "sudo systemctl restart NetworkManager"

# User Management
# -----------------------------------------------------------------------------
[user]
add = "sudo useradd -m {1}"
set_password = "sudo passwd {1}"
list_all = "cut -d: -f1 /etc/passwd"
list_groups = "groups {1}"

# Logs and diagnostics
# -----------------------------------------------------------------------------
[log]
boot = "journalctl -b"
service = "journalctl -u {1}"
follow = "journalctl -f"
errors = "journalctl -p err -b"
kernel = "dmesg"

# Hardware
# -----------------------------------------------------------------------------
[hardware]
cpu_info = "lscpu"
memory_info = "free -h"
temperatures = "sensors"
gpu_info = "lspci -k | grep -A 3 -i vga"
devices = "lspci"