active_distro = "ubuntu"

# System Packages (apt)
# -----------------------------------------------------------------------------
[app]
update = "sudo apt update && sudo apt upgrade -y"
install = "sudo apt install {1}"
remove = "sudo apt remove {1}"
purge = "sudo apt purge {1}"
search = "apt search {1}"
info = "apt show {1}"
list_installed = "apt list --installed"

# PPAs and External Sources
# -----------------------------------------------------------------------------
[ppa]
add = "sudo add-apt-repository ppa:{1}"
remove = "sudo add-apt-repository --remove ppa:{1}"
list = "grep -r --include='*.list' '^deb ' /etc/apt/sources.list.d/"

# Snap and Flatpak
# -----------------------------------------------------------------------------
[extra-install]
install_snap_pkg = "sudo snap install {1}"
remove_snap_pkg = "sudo snap remove {1}"
install_flatpak = "sudo apt install flatpak"
add_flathub = "flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo"
install_flatpak_pkg = "flatpak install flathub {1}"

# System Utilities
# -----------------------------------------------------------------------------
[sys]
list_usb = "lsusb"
list_partitions = "lsblk -f"
disk_space = "df -h"
processes = "btop"
make_executable = "chmod +x {1}"
create_folder = "mkdir -p {1}"

# Boot Utilities
# -----------------------------------------------------------------------------
[boot]
flash_iso = "sudo dd if={1} of={2} bs=4M status=progress oflag=sync"
format_fat32 = "sudo mkfs.vfat -F 32 {1}"
format_ext4 = "sudo mkfs.ext4 {1}"
unmount = "sudo umount {1}"
update_grub = "sudo update-grub"

# File Editing
# -----------------------------------------------------------------------------
[edit]
read = "cat {1}"
write = "micro {1}"

# Rice (to be added.... well maybe, idk ._.)
# -----------------------------------------------------------------------------
[rice]
# Soon

# Dotfiles (to be added)
# -----------------------------------------------------------------------------
[dots]
# Soon

# Services and Daemons
# -----------------------------------------------------------------------------
[service]
start = "sudo systemctl start {1}"
stop = "sudo systemctl stop {1}"
restart = "sudo systemctl restart {1}"
status = "systemctl status {1}"
enable = "sudo systemctl enable {1}"
disable = "sudo systemctl disable {1}"
list_all = "systemctl list-units --type=service"

# Cleanup / Cache Management
# -----------------------------------------------------------------------------
[clean]
clear_cache = "sudo apt clean"
remove_orphans = "sudo apt autoremove -y"
remove_old_configs = "sudo apt purge $(dpkg -l | awk '/^rc/ {print $2}')"
cache_size = "du -sh /var/cache/apt/archives"

# Networking
# -----------------------------------------------------------------------------
[net]
show_ip = "ip a"
ping = "ping -c 4 {1}"
list_wifi = "nmcli device wifi list"
connect_wifi = "nmcli device wifi connect {1} password {2}"
status = "nmcli general status"
restart = "sudo systemctl restart NetworkManager"

# User Management
# -----------------------------------------------------------------------------
[user]
add = "sudo adduser {1}"
set_password = "sudo passwd {1}"
list_all = "cut -d: -f1 /etc/passwd"
list_groups = "groups {1}"

# Logs and diagnostics
# -----------------------------------------------------------------------------
[log]
boot = "journalctl -b"
service = "journalctl -u {1}"
follow = "journalctl -f"
errors = "journalctl -p err -b"
kernel = "dmesg"

# Hardware info
# -----------------------------------------------------------------------------
[hw]
cpu_info = "lscpu"
memory_info = "free -h"
temperatures = "sensors"
gpu_info = "lspci -k | grep -A 3 -i vga"
devices = "lspci"